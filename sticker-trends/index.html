<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>表情包的潮汐 · 你与卫十七</title>
<style>
:root{--paper:#f5f4ef;--panel:#fffefa;--ink:#21362e;--muted:#6e7972;--line:#dce2d9;--green:#267658;--green-soft:#e6f0e8;--purple:#8172b5;--orange:#c47c40;--shadow:0 12px 35px #24382b0b;--font:"Segoe UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--font)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button,input,select{border:1px solid var(--line);border-radius:7px;background:var(--panel)}button{padding:7px 12px}button:hover{border-color:var(--green);background:var(--green-soft)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #26765855;outline-offset:2px}button[aria-pressed="true"]{background:var(--green);color:var(--panel);border-color:var(--green)}button:disabled{opacity:.4;cursor:default}a{color:var(--green)}header{max-width:1500px;margin:auto;padding:32px 36px 22px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);margin:0 0 7px}h1{font-size:32px;line-height:1.2;letter-spacing:-1px;font-weight:600;margin:0}header p{margin:10px 0 0;color:var(--muted)}.snapshot{font-size:12px;color:var(--muted);text-align:right}.shell{max-width:1500px;margin:auto;padding:0 36px 36px;display:grid;grid-template-columns:292px minmax(0,1fr);gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}aside{align-self:start;overflow:hidden}.side-head{padding:19px 18px 12px;border-bottom:1px solid var(--line)}.side-head h2{font-size:17px;margin:0;display:flex;justify-content:space-between;gap:10px}.side-head h2 span{color:var(--muted);font-size:12px;font-weight:400}.side-head p{font-size:12px;color:var(--muted);margin:6px 0 12px}.search{width:100%;padding:9px 11px;background:var(--paper)}#stickerList{height:660px;overflow:auto;padding:8px}.sticker{display:grid;grid-template-columns:48px minmax(0,1fr) 20px;gap:10px;align-items:center;width:100%;padding:9px 10px;border:0;text-align:left;border-radius:8px;background:transparent;margin:2px 0}.sticker.selected{background:var(--green-soft);color:var(--ink)}.sticker img{width:48px;height:48px;object-fit:contain;background:var(--panel);border-radius:6px}.sticker .name{font-size:13px;line-height:1.3;display:block}.sticker .count{font-size:11px;color:var(--muted);display:block;margin-top:5px}.check{width:17px;height:17px;border:1px solid var(--line);border-radius:50%;font-size:11px;display:grid;place-items:center;color:transparent}.selected .check{color:var(--panel);border-color:var(--green);background:var(--green)}.content{min-width:0}.toolbar{padding:17px 20px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}.control label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.segments{display:flex;gap:3px}.segments button{font-size:12px;padding:6px 12px}.dates{display:flex;gap:7px;align-items:center}.dates input{width:139px;padding:5px 7px;font-size:12px}.toolbar select{padding:6px 9px;font-size:12px}.range-shortcuts{display:flex;gap:5px;align-self:end;margin-left:auto}.range-shortcuts button{font-size:11px;padding:6px 9px}.plot-panel{margin-top:16px;padding:23px 25px 18px;position:relative}.plot-top{display:flex;gap:15px;justify-content:space-between;align-items:start}.plot-top h2{font-size:20px;margin:0;font-weight:600}.plot-top p{font-size:12px;color:var(--muted);margin:5px 0 0}.smooth-control{font-size:12px;white-space:nowrap;display:flex;gap:7px;align-items:center}.smooth-control input{accent-color:var(--green)}#legend{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0 2px;min-height:29px}.legend-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--panel)}.legend-item i{width:16px;height:3px;display:block;border-radius:2px}.legend-item img{width:22px;height:22px;object-fit:contain}#plot{width:100%;height:390px;display:block;touch-action:pan-y}.axis-label{fill:var(--muted);font-size:11px}.gridline{stroke:var(--line);stroke-width:1}.line-raw{fill:none;stroke-width:1.5;opacity:.3}.line-trend{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}.point{stroke:var(--panel);stroke-width:1.5}.crosshair{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 5;pointer-events:none}.tip{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;box-shadow:0 10px 25px #182c2426;min-width:180px;max-width:300px;font-size:12px;pointer-events:none;z-index:3}.tip strong{display:block;margin-bottom:9px}.tip-row{display:flex;gap:12px;justify-content:space-between;margin:6px 0}.tip-row i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.plot-foot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);padding-top:9px;border-top:1px solid var(--line)}.plot-foot button{font-size:11px;padding:3px 9px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:19px 24px;margin-top:16px}.metric{border-right:1px solid var(--line)}.metric:last-child{border:0}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{font-size:24px;line-height:1.4;font-weight:600;font-variant-numeric:tabular-nums}.metric span{font-size:11px;color:var(--muted);display:block}.months-panel{margin-top:16px;padding:20px 24px}.months-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.months-top h2{font-size:14px;margin:0}.months-top span{font-size:11px;color:var(--muted)}#months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}.month{border:0;padding:9px 2px;min-width:0;border-radius:5px;font-size:11px}.month span{display:block;font-variant-numeric:tabular-nums;font-size:13px;margin-top:3px}.scope{font-size:11px;color:var(--muted);margin:14px 2px}.empty{padding:40px 10px;text-align:center;color:var(--muted)}.notice{font-size:11px;color:var(--green);min-height:18px;margin-top:5px}.banner{padding:50px;text-align:center}.mono{font-variant-numeric:tabular-nums}.loading{padding:50px}.back{font-size:12px;white-space:nowrap}
@media(max-width:1120px){header{padding:25px 22px 20px}.shell{padding:0 22px 25px;grid-template-columns:245px minmax(0,1fr);gap:15px}.toolbar{gap:12px}.range-shortcuts{margin-left:0}.plot-panel{padding:20px 17px}.plot-top{flex-wrap:wrap}.metrics{gap:12px;padding:17px}.metric b{font-size:21px}}
@media(max-width:800px){header{align-items:start}.snapshot{display:none}.shell{display:flex;flex-direction:column}.content{order:0}aside{order:1;width:100%}#stickerList{height:330px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}.plot-panel{margin-top:12px}#plot{height:330px}.scope{margin-bottom:0}#months{grid-template-columns:repeat(6,minmax(0,1fr))}.month{padding:7px 2px}}
@media(max-width:450px){header{padding:23px 16px 17px}h1{font-size:26px}.shell{padding:0 12px 20px;gap:12px}.toolbar{padding:14px;gap:12px 15px}.plot-panel{padding:17px 12px}.plot-top h2{font-size:18px}.dates input{width:min(128px,calc((100vw - 114px)/2));min-width:0}.range-shortcuts{width:100%}.smooth-control{font-size:11px}.metrics{padding:15px 12px;gap:8px}.metric b{font-size:18px}.metric span{font-size:10px}.metric small{font-size:10px}.plot-foot{flex-wrap:wrap}.sticker{grid-template-columns:39px minmax(0,1fr) 16px;gap:6px;padding:7px 6px}.sticker img{width:39px;height:39px}.sticker .name{font-size:12px}.months-panel{padding:16px 12px}#plot{height:305px}}
</style>
</head>
<body>
<header><div><p class="eyebrow">你 × 卫十七 / 表情档案</p><h1>表情包的潮汐</h1><p>看看哪一个陪你们聊了很久，哪一个突然热闹起来。</p></div><div class="snapshot"><div id="dateCaption"></div><a class="back" href="/">返回首页 ↗</a></div></header>
<main class="shell">
<aside class="panel"><div class="side-head"><h2>选择表情包 <span id="selectionCount">最多对比 3 种</span></h2><p>按当前时间范围的使用次数排序</p><input class="search" id="search" type="search" placeholder="找一个表情包…" aria-label="搜索表情包"><div class="notice" id="notice" aria-live="polite"></div></div><div id="stickerList"></div></aside>
<div class="content">
<section class="toolbar panel" aria-label="趋势筛选">
<div class="control"><label>统计周期</label><div class="segments" id="period"><button data-value="day" aria-pressed="false">日</button><button data-value="week" aria-pressed="true">周</button><button data-value="month" aria-pressed="false">月</button></div></div>
<div class="control"><label for="sender">谁在用</label><select id="sender"><option value="both">你们两人</option><option value="me">只看你</option><option value="wei">只看卫十七</option></select></div>
<div class="control"><label for="measure">纵轴</label><select id="measure"><option value="count">使用次数</option><option value="share">占全部表情的比例</option></select></div>
<div class="control"><label for="start">时间范围</label><div class="dates"><input type="date" id="start" aria-label="开始日期"><span>—</span><input type="date" id="end" aria-label="结束日期"></div></div>
<div class="range-shortcuts"><button data-range="all">全部历史</button><button data-range="90">近 90 天</button><button data-range="30">近 30 天</button></div>
</section>
<section class="plot-panel panel">
<div class="plot-top"><div><h2 id="chartTitle">它们什么时候最常出现？</h2><p id="chartSubtitle"></p></div><label class="smooth-control"><input type="checkbox" id="smooth" checked>显示平滑趋势</label></div>
<div id="legend"></div><svg id="plot" role="img" aria-label="所选表情包使用趋势"></svg><div id="tooltip" class="tip" hidden></div>
<div class="plot-foot"><span id="plotNote"></span><button id="peakJump">放大最活跃时段 ↗</button></div>
</section>
<section class="metrics panel" aria-label="当前选中表情统计"><div class="metric"><small>当前范围 · 选中表情</small><b id="rangeTotal">—</b><span id="rangeTotalHint"></span></div><div class="metric"><small id="peakLabel">最高的一周</small><b id="peakValue">—</b><span id="peakDate"></span></div><div class="metric"><small>最常用的一种</small><b id="mostUsed" style="font-size:16px"></b><span id="mostUsedHint"></span></div></section>
<section class="months-panel panel"><div class="months-top"><h2>按月看热度</h2><span>全部历史 · 选中表情次数 · 点击月份放大</span></div><div id="months"></div></section>
<p class="scope" id="scope"></p>
</div></main>
<script src="data.js"></script><script src="app.js"></script>
</body></html>
